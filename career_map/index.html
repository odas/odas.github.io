<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Map — Mycelium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Spline+Sans:wght@300;400;500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --loam:#14110d;
    --humus:#1d1914;
    --duff:#2a241c;
    --spore:#ece4d4;
    --spore-dim:#a89d89;
    --hairline:rgba(236,228,212,.12);
    --panel-w:380px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--loam);
    color:var(--spore);
    font-family:'Spline Sans',system-ui,sans-serif;
    overflow:hidden;
  }
  /* substrate: gradient loam by default; photo + dark overlay if JSON sets map.backgroundImage */
  #stage{
    position:fixed;inset:0;
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(60,50,35,.25), transparent 60%),
      radial-gradient(1000px 700px at 85% 85%, rgba(40,45,35,.22), transparent 60%),
      var(--loam);
  }
  #stage.photo{
    background-size:cover;background-position:center;
  }
  svg{width:100%;height:100%;display:block;touch-action:manipulation}

  header{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:baseline;gap:14px;
    padding:14px 18px;pointer-events:none;z-index:5;
  }
  header h1{
    font-family:'Instrument Serif',serif;font-weight:400;
    font-size:clamp(18px,2.4vw,26px);letter-spacing:.02em;
  }
  header .sub{
    font-family:'Spline Sans Mono',monospace;font-size:11px;
    color:var(--spore-dim);letter-spacing:.08em;text-transform:uppercase;
  }
  #databadge{
    position:fixed;top:14px;right:16px;z-index:6;
    font-family:'Spline Sans Mono',monospace;font-size:10.5px;
    color:var(--spore-dim);border:1px solid var(--hairline);
    border-radius:99px;padding:4px 10px;background:rgba(20,17,13,.6);
    display:none;
  }

  #hints{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    display:flex;gap:16px;flex-wrap:wrap;
    padding:10px 18px;pointer-events:none;
    font-family:'Spline Sans Mono',monospace;font-size:10.5px;
    color:var(--spore-dim);letter-spacing:.04em;
    background:linear-gradient(transparent, rgba(20,17,13,.85));
  }
  #hints b{color:var(--spore);font-weight:500}
  @media (hover:none){ #hints .kb{display:none} }

  /* throughline legend */
  #tlbar{
    position:fixed;left:0;right:0;bottom:34px;z-index:5;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;
    padding:0 14px;
  }
  #tlbar .lbl{
    font:400 10px 'Spline Sans Mono',monospace;color:var(--spore-dim);
    letter-spacing:.12em;text-transform:uppercase;margin-right:4px;
  }
  #tlbar button{
    background:rgba(29,25,20,.8);border:1px dashed var(--hairline);
    color:var(--spore-dim);font:400 11px 'Spline Sans Mono',monospace;
    letter-spacing:.04em;padding:5px 12px;border-radius:99px;cursor:pointer;
  }
  #tlbar button:hover{color:var(--spore)}
  #tlbar button.active{color:var(--spore);border-style:solid;background:var(--duff)}
  @media (max-width:899px){ #tlbar{bottom:40px;flex-wrap:nowrap;overflow-x:auto;
    justify-content:flex-start;padding:0 10px 4px;scrollbar-width:none}
    #tlbar::-webkit-scrollbar{display:none}
    #tlbar button{white-space:nowrap;font-size:10px;padding:4px 10px;flex:0 0 auto}
    #tlbar .lbl{flex:0 0 auto}
    header{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px}
    #databadge{top:62px;left:14px;right:auto;font-size:10px}
  }

  /* node visuals */
  .hypha{fill:none;stroke-linecap:round;opacity:.45}
  .origin-hypha{fill:none;stroke-linecap:round;opacity:.28}
  .throughline{fill:none;stroke-dasharray:3 7;opacity:.4;stroke-linecap:round}
  .node{cursor:pointer;outline:none}
  .node .cap{transition:filter .2s}
  .node:hover .cap, .node.focused .cap{filter:brightness(1.35) drop-shadow(0 0 8px currentColor)}
  .node .ring{fill:none;stroke-width:1.4;opacity:0;transition:opacity .15s}
  .node.focused .ring{opacity:.9}
  .cap-spot{pointer-events:none}
  .nlabel{
    font-family:'Spline Sans',sans-serif;font-weight:400;
    fill:var(--spore);paint-order:stroke;stroke:rgba(20,17,13,.85);stroke-width:3px;
    text-anchor:middle;pointer-events:none;
  }
  .nyears{
    font-family:'Spline Sans Mono',monospace;
    fill:var(--spore-dim);text-anchor:middle;pointer-events:none;
    paint-order:stroke;stroke:rgba(20,17,13,.85);stroke-width:3px;
  }
  .future-cap{stroke-dasharray:4 4}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:.9}}
  .future .cap{animation:breathe 4.5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){
    .future .cap{animation:none;opacity:.75}
  }

  /* quiet highlight mode */
  .tlmode .node{opacity:.16;transition:opacity .25s}
  .tlmode .node.lit{opacity:1}
  .tlmode .node.lit .cap{filter:brightness(1.25) drop-shadow(0 0 7px currentColor)}
  .tlmode .hypha,.tlmode .origin-hypha{opacity:.07;transition:opacity .25s}
  .tlmode .throughline{opacity:.08;transition:opacity .25s}
  .tlmode .throughline.active{opacity:.95;stroke-width:2.2}

  /* panel */
  #panel{
    position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);
    max-width:100vw;z-index:10;
    background:rgba(29,25,20,.97);
    border-left:1px solid var(--hairline);
    transform:translateX(105%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  #panel.open{transform:translateX(0)}
  #panel .inner{overflow-y:auto;padding:26px 24px 40px;flex:1}
  #panel .kicker{
    font-family:'Spline Sans Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--spore-dim);
    margin-bottom:10px;display:flex;align-items:center;gap:8px;
  }
  #panel .kicker .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  #panel h2{
    font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;
    font-size:26px;line-height:1.2;margin-bottom:6px;
  }
  #panel .years{
    font-family:'Spline Sans Mono',monospace;font-size:12px;
    color:var(--spore-dim);margin-bottom:20px;
  }
  #panel .triglabel{
    font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:var(--spore-dim);margin-bottom:4px;
  }
  #panel .trigger{
    font-family:'Instrument Serif',serif;font-size:20px;line-height:1.35;
    padding:14px 16px;border-radius:10px;margin-bottom:22px;
    background:var(--duff);
  }
  #panel h3{
    font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    color:var(--spore-dim);margin:20px 0 8px;
  }
  #panel p, #panel li{font-size:13.5px;line-height:1.55;font-weight:300;margin-bottom:8px}
  #panel ul{padding-left:18px}
  #panel li{margin-bottom:6px}
  #panel .qtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  #panel .qtag{
    font-family:'Spline Sans Mono',monospace;font-size:10.5px;
    border:1px solid var(--hairline);border-radius:99px;padding:3px 9px;
    color:var(--spore-dim);
  }
  #panel .threadlist button{
    display:block;width:100%;text-align:left;
    background:none;border:none;color:var(--spore);
    font:300 13.5px 'Spline Sans',sans-serif;padding:8px 10px;margin:2px 0;
    border-radius:8px;cursor:pointer;
  }
  #panel .threadlist button:hover{background:var(--duff)}
  #panel .threadlist .mk{color:var(--spore-dim);font-family:'Spline Sans Mono',monospace;font-size:11px;margin-left:6px}
  .blend-row{width:100%;text-align:left;margin-bottom:10px}
  .blend-row .bl-name{font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between}
  .blend-row .bl-name span:last-child{font-family:'Spline Sans Mono',monospace;color:var(--spore-dim)}
  .blend-bar{height:6px;border-radius:3px;background:var(--duff);overflow:hidden}
  .blend-bar i{display:block;height:100%;border-radius:3px}
  #panel .closebtn{
    position:absolute;top:12px;right:12px;
    background:none;border:1px solid var(--hairline);color:var(--spore-dim);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;
  }
  #panel .closebtn:hover{color:var(--spore)}

  @media (max-width:899px){
    #panel{
      top:auto;left:0;right:0;bottom:0;width:100%;
      max-height:62vh;border-left:none;border-top:1px solid var(--hairline);
      border-radius:16px 16px 0 0;
      transform:translateY(105%);
    }
    #panel.open{transform:translateY(0)}
  }

  /* question index */
  #qindex{
    position:fixed;inset:0;z-index:20;background:rgba(20,17,13,.94);
    display:none;overflow-y:auto;padding:40px 20px 60px;
  }
  #qindex.open{display:block}
  #qindex .wrap{max-width:640px;margin:0 auto}
  #qindex h2{
    font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;margin-bottom:4px;
  }
  #qindex .sub{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--spore-dim);margin-bottom:26px}
  #qindex .arch{margin-bottom:22px}
  #qindex .arch h3{
    font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    color:var(--spore-dim);border-bottom:1px solid var(--hairline);
    padding-bottom:6px;margin-bottom:8px;
  }
  #qindex button{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--humus);border:1px solid var(--hairline);color:var(--spore);
    font:300 13px 'Spline Sans',sans-serif;padding:7px 12px;margin:3px 6px 3px 0;
    border-radius:99px;cursor:pointer;
  }
  #qindex button:hover{background:var(--duff)}
  #qindex button .dot{width:7px;height:7px;border-radius:50%}
  #qindex .empty{color:var(--spore-dim);font-size:13px;line-height:1.6}
  #qindex .closebtn{
    position:fixed;top:14px;right:16px;
    background:none;border:1px solid var(--hairline);color:var(--spore-dim);
    width:32px;height:32px;border-radius:50%;cursor:pointer;
  }
  :focus-visible{outline:1.5px solid var(--spore-dim);outline-offset:2px}
</style>
</head>
<body>
<div id="stage"><svg id="map" role="application" aria-label="Interactive career map"></svg></div>

<header>
  <h1 id="mapname">Career Map</h1>
  <span class="sub" id="mapnote"></span>
</header>
<div id="databadge"></div>

<nav id="tlbar" aria-label="Throughlines"></nav>

<div id="hints">
  <span class="kb"><b>1–9</b> trunks</span>
  <span class="kb"><b>←/→</b> nodes</span>
  <span class="kb"><b>Enter</b> open</span>
  <span class="kb"><b>Q</b> question index</span>
  <span class="kb"><b>Esc</b> close</span>
  <span><b>tap</b> any mushroom to open its story</span>
</div>

<aside id="panel" aria-live="polite">
  <button class="closebtn" id="panelclose" aria-label="Close panel">✕</button>
  <div class="inner" id="panelinner"></div>
</aside>

<div id="qindex">
  <button class="closebtn" id="qclose" aria-label="Close question index">✕</button>
  <div class="wrap" id="qwrap"></div>
</div>

<script>
"use strict";
/* =========================================================
   Career Map v3 — mycelium renderer
   DATA LOADING (first success wins):
     1. ./career.json      — Codex schema (see normalize())
     2. ./career_map.json  — original schema
     3. embedded DUMMY     — fictional sample
   Both schemas are normalized to one internal shape, so either
   file works unmodified. All extra fields are optional.

   AUTHORED POSITIONS: if nodes carry pos:[x,y] in absolute
   coordinates (opus viewBox space or any consistent space),
   the whole authored layout is bbox-fitted to this canvas.
   Portrait phones get the same layout rotated 90° (transpose),
   preserving every relative distance. Values in 0–1 are
   treated as canvas fractions. Nodes without pos fall back to
   deterministic fan layout around their trunk.
   ========================================================= */

const DUMMY = {"meta":{"subject":"Alex Mercer","purpose":"Node/edge career map — recall triggers for mid-interview story retrieval","note":"Trunks = shared thematic root. Threads = individual tracks. Throughlines = connections crossing trunk boundaries. Sources: LinkedIn 2026, techbuilds article May/Jun 2026, resumes.","last_updated":"July 2026"},"trunks":[{"id":"automation-axle","trunk_name":"The Automation Axle","trunk_trigger":"I started as a mechanical engineer. That's not the detour — that's the source code.","threads":[{"id":"mit-mechanical-engineer","thread_name":"MIT Mechanical Eng.","years":"2008–2012","recall_trigger":"Top 1% in physics nationally. Wrote G-code before I knew what a data pipeline was.","detail":{"what":"B.S. Mechanical Engineering, MIT. Merit scholarship 2011–2012.","milestones":["C++, Linear Algebra, Kinematics — the computation habits formed here","Boeing-funded summer research internship (2011) — first industrial research exposure, fully funded","Merit scholarship covered full academic expenses in final year"],"interview_use":"When asked 'why data engineering?' — this is the answer. Not a pivot from hardware into data; a mechanical engineer who always analyzed system outputs."},"question_types":["why this field"]},{"id":"eth-robotics-msc","thread_name":"ETH Zurich Robotics M.Sc.","years":"2012–2015","recall_trigger":"Dynamic payload balancing in articulated robots. Best Student Demo at Munich — only M.Sc. in a room of PhDs.","detail":{"what":"M.Sc. at ETH Zurich. Fully funded — Swiss Excellence Scholar plus research stipends.","degree_note":"Parchment says Mechatronics. All resumes and LinkedIn say 'Robotics and Control' — that needs fixing before active interviews. Honest framing: degree titled Mechatronics; research was deep control systems. The work description is accurate; the degree title shorthand is not.","thesis":"Algorithmic load balancing and latency reduction in 6-axis robotic arms. Thesis document exists; not published as a journal article.","milestones":["Time-series analysis, sensor calibration, hypothesis testing, outlier detection, Kalman filtering","Won Best Student Demo at European Robotics Summit (2014) — only M.Sc. among PhDs selected to present","Presenter, International Conference on Automation (2014)"],"interview_use":"The thesis was a high-frequency data project. The sensors generated messy, noisy datasets; signal processing was the actual job. Best Student Demo = the presentation instinct is old and was validated in a competitive research context."},"question_types":["ownership"]},{"id":"cad-systems-integration","thread_name":"CAD Systems Integration","years":"2014–2016","recall_trigger":"Explaining kinematics to Grade 8 kids. The enterprise presentation came from here.","detail":{"what":"Workshop facilitator and drafting consultant","milestones":["Led physics/robotics workshops for Grades 8–12","Ran alongside M.Sc. and continued into post-MSc period"],"interview_use":"The throughline for the enterprise customer presentations. Explaining complex physical systems simply is a practiced skill, not a personality trait."}}]},{"id":"embedded-systems-circuit","trunk_name":"Embedded Systems Circuit","trunk_trigger":"Post-MSc: tried three hardware directions before the pivot. Then tried a PhD. The pivot story runs through all of this.","threads":[{"id":"nanomaterial-startup","thread_name":"Hardware Startup (AeroParts, acquired by Titan)","years":"Mar–Nov 2016","recall_trigger":"Programmed an automated defect scanner for aerospace composites. Got a raise in 3 months. Company acquired by Titan Aerospace.","detail":{"what":"Systems Technician, AeroParts Inc. AeroParts was subsequently acquired by Titan Aerospace.","milestones":["Formulated and tested optical scanning scripts for micro-fracture detection","Supported investor fundraising — reports, patent review on sensor arrays","Received pay raise within 3 months"],"interview_use":"First startup context — multi-hat, direct business impact, bridging engineering to investor communication. The 'I can present technical work to non-technical stakeholders' muscle started here."},"question_types":["conflict"]},{"id":"freelance-mechatronics","thread_name":"Freelance Analyst Phase (Apex + Transit Auth)","years":"2017–2018","recall_trigger":"Tolerance analysis for a local manufacturer, contract fieldwork for the transit authority. Different domains, same analytical toolkit.","detail":{"what":"Two parallel contract roles. Part of the broader LinkedIn 'Multiple' entry (Mar 2017–Sept 2019).","milestones":["Drafting Assistant, Apex Manufacturing (2017–2018): failure mode literature review","Contract QA Analyst, City Transit Authority, summer 2018 — vibration analysis applied in public infrastructure"],"interview_use":"Domain-transfer proof: the analytical methodology is portable. The Transit Authority role closes a loop with the Robotics thesis."}},{"id":"tu-berlin-phd","thread_name":"TU Berlin PhD + The IoT Course That Changed Everything","years":"2018–2019","recall_trigger":"Started a PhD. Took a superb Industrial IoT course and got an A+. That gave me the confidence to pivot to data. Left the PhD — I was already uncertain about the path.","detail":{"what":"PhD student, TU Berlin (2018–2019), Industrial Engineering. Research: predictive wear models in CNC machining. Left without completing — was uncertain about the research path and chose to pivot to software scale instead.","milestones":["A+ in IND300 'Industrial IoT & Sensor Networks' — Python project: aligned and quantified temperature/vibration anomalies in a turbine dataset. This course was superb and directly built the confidence to pivot.","Investigated wear patterns in high-speed milling","TA for ENG201 — physical systems lab course","Left the PhD: already uncertain about the research path."],"interview_use":"The honest framing: I started a PhD, realised it wasn't the right path, and the IoT course I took there gave me the confidence to pivot to data engineering. That course is the clearest pre-enterprise data credential."}}]},{"id":"deliberate-pivot","trunk_name":"The Deliberate Pivot","trunk_trigger":"Left a PhD, went back to school for data, then shipped four projects in three months.","threads":[{"id":"data-reskill","thread_name":"The Reskill (Predictive Maintenance Cert)","years":"Sept–Dec 2019","recall_trigger":"91st percentile on technical assessments. Four months, then immediately shipped projects.","detail":{"what":"Self-directed structured curriculum","milestones":["SQL, Tableau, Cloud Basics","Python: pandas, numpy, matplotlib, scikit-learn, dask, flask","Time-series forecasting, anomaly detection","91st percentile on standard technical assessments","Followed immediately with live project work"],"interview_use":"The pivot was not a drift. It was a structured 4-month commitment after leaving a PhD, followed by immediate application. Not 'I decided to try data' — 'I identified the gap and closed it.'"},"question_types":["influence"]},{"id":"freelance-ds-2020","thread_name":"Freelance Data Projects (4 in 3 months)","years":"Jan–Mar 2020","recall_trigger":"A logistics dashboard, a fleet viz app, and two Kaggle competitions. Three months.","detail":{"what":"Data Analyst freelance projects","milestones":["Tableau BI dashboard for shipping route KPIs — devised routing strategy at optimised profit","Plotly Python viz app from vehicle telematics data, deployed on AWS","Kaggle — Manufacturing Defect Detection: XGBoost; 12% improvement","Kaggle — Predictive Maintenance Logs: NLP TF-IDF, 87% accuracy"],"interview_use":"Breadth-first on entry into a new domain: logistics, fleet data, manufacturing, NLP — four different problem types in one quarter. Shows how I explore. Note: all were capstone/free projects, not paid client work."}},{"id":"telemetry-db-engineer","thread_name":"Telemetry DB Engineer (LogSeq / SensorNet)","years":"Apr 2020","recall_trigger":"PostgreSQL from raw edge devices to validate an anomaly detection ML model. Physics met data engineering.","detail":{"what":"Data Engineer Intern, SensorNet Inc.","milestones":["Ingested data from MQTT brokers into a PostgreSQL relational database","Designed schema and queried to validate performance analytics for the platform"],"interview_use":"First explicit data engineering work — ingestion, schema design, analytical validation. The first time physical domain knowledge directly accelerated the data work."}},{"id":"composite-materials","thread_name":"Composite Materials ML (Waterloo)","years":"Apr–Jul 2020","recall_trigger":"Hyperparameter search through factory floor process parameters. Applied ML.","detail":{"what":"Machine Learning Intern","milestones":["Feature extraction: thermodynamic and kinetic features from machinery logs","Ensemble ML model with hyperparameter tuning and Dask parallel processing","Prototyped automated scan to predict yield degradation"],"interview_use":"Industrial informatics + ensemble methods + parallel processing. Research-grade ML fluency, not just applied tooling. The hardware domain knowledge is doing real work here."},"question_types":["ambiguity"]}]},{"id":"production-engineering","trunk_name":"Production Data Engineering","trunk_trigger":"2.5 years shipping real pipelines and compliance automation.","threads":[{"id":"enterprise-ingestion","thread_name":"Pipeline Architect (20+ Sources)","years":"Oct 2020–Mar 2023","recall_trigger":"ERP, CRM, SCADA, Active Directory — 20+ APIs, one CI/CD pipeline.","detail":{"what":"Data Engineer, Data Platform Team","milestones":["ELT API ingestion using Databricks, AWS Lambda, API Gateway","Sources: SAP, Salesforce, Okta, custom factory APIs, and 15+ more","Warehouse usage monitoring, data catalog, data governance","Contributed to unified DataShare architecture proposal — collaborative initiative; sought out by a Sales Engineer who recognized the SCADA ingestion expertise, connected via the internal security team who also consulted her","AWS Certified Solutions Architect","Represented company at cloud data summits (2022–2023)"],"interview_use":"The breadth of source systems shows production versatility. Not a toy pipeline — internal data infrastructure for a major enterprise firm."}},{"id":"iso-compliance-automation","thread_name":"ISO/SOX Compliance Automation","years":"Oct 2020–Mar 2023","recall_trigger":"SQL that replaced 100+ manual audit hours per quarter. InfoSec became a partner team.","detail":{"what":"Data Engineer, Analytics & Automation","milestones":["Architected real-time monitoring of ISO/SOX compliance: Access exceptions, VPN gaps","Continuous exception detection dashboards and alerting, built with InfoSec team","Saved 100+ manual audit hours per quarter","Contributed to compliance education within the org","Spurred business process changes for violation avoidance and minimisation","Trained multiple new project members"],"interview_use":"Highest-leverage project on the resume — measurable impact, cross-functional collaboration. The throughline: I don't just build pipelines, I build systems that change behavior."}},{"id":"external-presenter","thread_name":"External Presenter (7 Audiences + Consortium)","years":"2022–2023","recall_trigger":"Presented architecture to the Data Governance Consortium. Seven audiences total.","detail":{"what":"External technical presentations on compliance automation","milestones":["7 external presentations on the automation project","One specifically to the Data Governance Consortium","Trained new project members"],"interview_use":"A Data Engineer who represents their work externally is unusual. Connects directly to Munich 2014 and the workshop days. The presentation thread runs the full length of the career."},"question_types":["ownership"]}]},{"id":"manufacturing-cloud-bridge","trunk_name":"Manufacturing Data Cloud Bridge","trunk_trigger":"The one role where industrial hardware and production cloud engineering happened simultaneously. The map's most important bridge node.","threads":[{"id":"yield-optimization-algos","thread_name":"IoT Cloud Engineer (FactoryTwin Startup)","years":"Jul 2023–Jan 2024","recall_trigger":"Deployed a digital twin app to Azure. IoT Hub to AKS migration. Collaborated with reliability engineers. All three skills at once.","detail":{"what":"Cloud Engineer, FactoryTwin Startup","milestones":["Deployed proprietary digital twin analysis app","Cross-functional collaboration with reliability engineers, supported integration of edge analytics","VM deployment migration to Kubernetes (AKS)"],"interview_use":"For DE roles: recent Azure/AWS production work. For IoT-facing roles: this is the clearest proof that physical engineering isn't the goal — it's already the work. Framed right, this role makes everything before it look like preparation for it."}}]},{"id":"ai-tools-era","trunk_name":"AI Tools Era","trunk_trigger":"Built independently, got clear on what I want.","threads":[{"id":"ai-portfolio-apps","thread_name":"AI Tool Portfolio (7 apps)","years":"2023–present","recall_trigger":"Seven friction-killers built in a chat window. No pipeline, no team.","detail":{"what":"Self-directed AI application portfolio. Primary stacks: Python, Streamlit, LLM APIs, PostgreSQL.","apps":["InvoiceIQ — Vision API scanner, Streamlit frontend","Daily operations dashboard — 'a wall of rows, made calm'","Commodity tracker — live market data, AI briefing","Gamified interview prep app — adaptive LLM-generated questions, multi-section analytics","Blueprint-to-text — CAD schematic annotations to structured JSON","Audio manual reader — technical manuals read aloud","AI safety checklist generator"],"interview_use":"The pile is the point. Seven tools in a chat window, each from a real friction point. The valuable part was product judgment — which field is a dropdown, what happens when it fails. 'The syntax got cheap. That didn't.'"}},{"id":"robotic-arm-controller","thread_name":"OpenHardwareHub (Founder)","years":"Jun 2025–present","recall_ /* ---------- palette & shapes ---------- */
const DEFAULT_COLORS = ["#d9a441","#8f6fc2","#4f8fb8","#7ba05b","#c96f4a","#b8567d","#5fa8a0","#a0824f"];
const CAPS = [
  (r)=>`M ${-r} 0 Q ${-r} ${-r*1.1} 0 ${-r*1.1} Q ${r} ${-r*1.1} ${r} 0 Z`,                     // round button
  (r)=>`M ${-r*0.9} 0 L 0 ${-r*1.5} L ${r*0.9} 0 Z`,                                            // conical
  (r)=>`M ${-r*1.15} 0 Q ${-r*0.6} ${-r*0.5} 0 ${-r*0.55} Q ${r*0.6} ${-r*0.5} ${r*1.15} 0 Z`,  // flat shelf
  (r)=>`M ${-r*0.85} 0 Q ${-r*0.95} ${-r*1.3} 0 ${-r*1.35} Q ${r*0.95} ${-r*1.3} ${r*0.85} 0 Z`,// bell
  (r)=>`M ${-r*1.1} 0 Q ${-r*0.9} ${-r*0.35} ${-r*0.5} ${-r*0.6} Q 0 ${-r*1.0} ${r*0.5} ${-r*0.6} Q ${r*0.9} ${-r*0.35} ${r*1.1} 0 Z`, // wavy chanterelle
  (r)=>`M ${-r*0.55} 0 Q ${-r*0.6} ${-r*1.5} 0 ${-r*1.55} Q ${r*0.6} ${-r*1.5} ${r*0.55} 0 Z`   // tall ink cap
];

/* ---------- normalize both schemas to one internal shape ---------- */
function normalize(raw){
  const out={ meta:raw.meta||{}, map:raw.map||{}, ui:raw.ui||{},
              trunks:[], throughlines:[], future:Array.isArray(raw.future)?raw.future:[] };
  (raw.trunks||[]).forEach((t,ti)=>{
    const nt={ id:(t.id!=null?String(t.id):"t"+ti),
      name:t.name||t.trunk_name||("Trunk "+(ti+1)),
      trigger:t.trigger||t.trunk_trigger||"",
      color:t.color||null, pos:goodPos(t.pos), threads:[] };
    (t.threads||[]).forEach((th,i)=>{
      nt.threads.push({ id:(th.id!=null?String(th.id):nt.id+"_"+i),
        name:th.name||th.thread_name||"", years:th.years||"",
        trigger:th.trigger||th.recall_trigger||"",
        detail:(th.detail!=null?th.detail:null), pos:goodPos(th.pos),
        shape:th.shape, question_types:Array.isArray(th.question_types)?th.question_types:[] });
    });
    out.trunks.push(nt);
  });
  (raw.throughlines||[]).forEach((tl,i)=>{
    out.throughlines.push({ id:(tl.id!=null?String(tl.id):"tl"+i),
      name:tl.name||("throughline "+(i+1)), trigger:tl.trigger||"",
      color:tl.color||"#8d8672",
      nodeIds:(tl.nodeIds||tl.thread_ids||[]).map(String) });
  });
  return out;
}
function goodPos(p){ return (Array.isArray(p)&&p.length===2&&isFinite(p[0])&&isFinite(p[1]))?p:null; }
const isFrac=(p)=>p[0]>=0&&p[0]<=1&&p[1]>=0&&p[1]<=1;

/* ---------- geometry (orientation-aware) ---------- */
let VB={w:1600,h:1000,pad:110}, SCALE=1, ANCHORS=null, isPortrait=false;
const LANDSCAPE_ANCHORS = [
  [0.24,0.30],[0.22,0.70],[0.52,0.80],[0.80,0.64],[0.76,0.24],[0.50,0.18],[0.50,0.50],[0.05,0.5],[0.95,0.5]
];
const PORTRAIT_ANCHORS = [
  [0.30,0.16],[0.72,0.14],[0.78,0.44],[0.68,0.76],[0.26,0.80],[0.22,0.48],[0.50,0.50],[0.50,0.05],[0.50,0.95]
];
function updateMode(){
  isPortrait = window.innerHeight > window.innerWidth*1.15;
  if(isPortrait){ VB={w:1000,h:1600,pad:95}; SCALE=1.7; ANCHORS=PORTRAIT_ANCHORS; }
  else          { VB={w:1600,h:1000,pad:110}; SCALE=1;  ANCHORS=LANDSCAPE_ANCHORS; }
  return isPortrait;
}
updateMode();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* Build POS for every entity. Absolute authored coords are bbox-fitted
   (uniform scale; transposed first in portrait). */
let POS={}, ORIGIN=null, SPORES=[];
function computePositions(data){
  POS={}; ORIGIN=null; SPORES=[];
  const abs=[];   // [x,y] collection for bbox fit
  const collect=p=>{ if(p&&!isFrac(p)) abs.push(p); };
  data.trunks.forEach(t=>{ collect(t.pos); t.threads.forEach(th=>collect(th.pos)); });
  const rawOrigin=goodPos(data.map.origin), rawSpores=(data.map.ambientSpores||[]).map(goodPos).filter(Boolean);
  collect(rawOrigin); rawSpores.forEach(collect);

  let T=null;
  if(abs.length>=3){
    const pts=isPortrait?abs.map(p=>[p[1],p[0]]):abs;
    let minx=1/0,miny=1/0,maxx=-1/0,maxy=-1/0;
    pts.forEach(([x,y])=>{minx=Math.min(minx,x);miny=Math.min(miny,y);
                          maxx=Math.max(maxx,x);maxy=Math.max(maxy,y);});
    const bw=Math.max(1,maxx-minx), bh=Math.max(1,maxy-miny);
    const availW=VB.w-2*VB.pad, availH=VB.h-2*VB.pad-70;   // room for labels/chips
    const s=Math.min(availW/bw, availH/bh);
    const ox=(VB.w-bw*s)/2 - minx*s, oy=(VB.h-bh*s)/2 - miny*s + 10;
    T=(p)=>{ const q=isPortrait?[p[1],p[0]]:p; return {x:q[0]*s+ox, y:q[1]*s+oy}; };
  }
  const place=(p)=>{
    if(!p)return null;
    if(isFrac(p)) return {x:p[0]*VB.w, y:p[1]*VB.h};
    return T?T(p):null;
  };

  const cx=VB.w/2, cy=VB.h/2;
  data.trunks.forEach((t,ti)=>{
    const authored=place(t.pos);
    const a=ANCHORS[ti%ANCHORS.length];
    const tp=authored||{x:a[0]*VB.w,y:a[1]*VB.h};
    POS[t.id]=tp;
    const n=t.threads.length;
    const base=Math.atan2(tp.y-cy,tp.x-cx);
    const spread=Math.PI*(isPortrait?0.95:0.85);
    t.threads.forEach((th,i)=>{
      const ap=place(th.pos);
      if(ap){ POS[th.id]=ap; return; }
      const frac = n===1 ? 0 : (i/(n-1))-0.5;
      const ang = base + frac*spread;
      const rad = (isPortrait?215:165) + ((i*53)%70);
      POS[th.id]={
        x: clamp(tp.x+Math.cos(ang)*rad, VB.pad, VB.w-VB.pad),
        y: clamp(tp.y+Math.sin(ang)*rad, VB.pad+30, VB.h-VB.pad)
      };
    });
  });
  ORIGIN=place(rawOrigin);
  SPORES=rawSpores.map(place).filter(Boolean);
}

/* ---------- color helpers ---------- */
function hexToRgb(h){ h=String(h).replace("#",""); if(h.length===3)h=h.split("").map(c=>c+c).join("");
  const v=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  return v.some(isNaN)?[136,136,136]:v; }
function rgbToHex(r){ return "#"+r.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join(""); }
function blend(weights, trunkColor){
  let tot=0, acc=[0,0,0];
  for(const [tid,w] of Object.entries(weights||{})){
    const c=hexToRgb(trunkColor[tid]||"#888888"); tot+=w;
    acc=acc.map((v,i)=>v+c[i]*c[i]*w);
  }
  if(tot<=0) return "#888888";
  return rgbToHex(acc.map(v=>Math.sqrt(v/tot)));
}

/* ---------- svg helpers ---------- */
const NS="http://www.w3.org/2000/svg";
function el(name,attrs,parent){ const e=document.createElementNS(NS,name);
  for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e; }
function curve(x1,y1,x2,y2,bow){ const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  return `M ${x1} ${y1} Q ${mx-dy/len*bow} ${my+dx/len*bow} ${x2} ${y2}`; }
const safeId=(s)=>String(s).replace(/[^a-zA-Z0-9_-]/g,"-");

/* ---------- state ---------- */
let DATA=null, TRUNKCOLOR={}, FLAT=[];
let focusIdx=-1;

/* ---------- render ---------- */
function render(data){
  DATA=data; updateMode(); computePositions(data);
  TRUNKCOLOR={};
  data.trunks.forEach((t,i)=>TRUNKCOLOR[t.id]=t.color||DEFAULT_COLORS[i%DEFAULT_COLORS.length]);

  const svg=document.getElementById("map");
  svg.innerHTML="";
  svg.setAttribute("viewBox",`0 0 ${VB.w} ${VB.h}`);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");

  // defs: soft glow filters (trunks + origin only — cheap everywhere else)
  const defs=el("defs",{},svg);
  const mkGlow=(id,dev)=>{
    const f=el("filter",{id,x:"-150%",y:"-150%",width:"400%",height:"400%"},defs);
    el("feGaussianBlur",{stdDeviation:dev,result:"b"},f);
    const m=el("feMerge",{},f);
    el("feMergeNode",{in:"b"},m); el("feMergeNode",{in:"SourceGraphic"},m);
  };
  mkGlow("glowT",5); mkGlow("glowO",10);

  const gAmbient=el("g",{},svg), gLines=el("g",{},svg),
        gThrough=el("g",{},svg), gNodes=el("g",{},svg);

  // header text: map.title wins, else meta.subject
  const title=(data.map&&data.map.title) ||
    ((data.meta&&data.meta.subject?data.meta.subject+" · ":"")+"Career Map");
  document.getElementById("mapname").textContent=title;
  document.getElementById("mapnote").textContent=(data.meta&&data.meta.last_updated)?("updated "+data.meta.last_updated):"";
  if(data.meta&&data.meta.documentTitle) document.title=data.meta.documentTitle;
  // optional photo substrate (map.backgroundImage) under a dark overlay
  const stage=document.getElementById("stage");
  if(data.map&&data.map.backgroundImage){
    stage.classList.add("photo");
    stage.style.backgroundImage=
      `linear-gradient(rgba(19,22,17,.82), rgba(19,22,17,.9)), url("${encodeURI(data.map.backgroundImage)}")`;
  }

  // ambient spores
  SPORES.forEach(p=>el("circle",{cx:p.x,cy:p.y,r:1.5*SCALE,fill:"#cfc4ab",opacity:.09},gAmbient));

  FLAT=[];

  // origin → trunk hyphae + origin spore
  if(ORIGIN){
    data.trunks.forEach(t=>{
      const tp=POS[t.id];
      el("path",{d:curve(ORIGIN.x,ORIGIN.y,tp.x,tp.y,46),class:"origin-hypha",
        stroke:TRUNKCOLOR[t.id],"stroke-width":2.2*SCALE,filter:"url(#glowT)"},gLines);
    });
    el("circle",{cx:ORIGIN.x,cy:ORIGIN.y,r:10*SCALE,fill:"#0f0d0a",
      stroke:"#4a4234","stroke-width":1,filter:"url(#glowO)"},gAmbient);
    el("circle",{cx:ORIGIN.x,cy:ORIGIN.y,r:3.5*SCALE,fill:"#cfc4ab",opacity:.6},gAmbient);
  }

  data.trunks.forEach((t,ti)=>{
    const col=TRUNKCOLOR[t.id], tp=POS[t.id];
    t.threads.forEach(th=>{
      const p=POS[th.id];
      el("path",{d:curve(tp.x,tp.y,p.x,p.y, 22+((ti*31)%26)),class:"hypha",
        stroke:col,"stroke-width":1.6},gLines);
    });
    drawNode(gNodes,defs,{id:t.id,label:t.name,years:"",color:col,shape:3,r:26,
      kind:"trunk",glow:true,seed:ti*7+3});
    FLAT.push(t.id);
    t.threads.forEach((th,i)=>{
      drawNode(gNodes,defs,{id:th.id,label:th.name,years:th.years,color:col,
        shape:(typeof th.shape==="number")?th.shape:(i%CAPS.length), r:13,
        kind:"thread",seed:ti*13+i*5+1});
      FLAT.push(th.id);
    });
  });

  data.throughlines.forEach((tl,i)=>{
    const pts=tl.nodeIds.map(id=>POS[id]).filter(Boolean);
    if(pts.length<2)return;
    let d=`M ${pts[0].x} ${pts[0].y}`;
    for(let k=1;k<pts.length;k++){
      const a=pts[k-1],b=pts[k];
      d+=` Q ${(a.x+b.x)/2+((i%2?1:-1)*40)} ${(a.y+b.y)/2+40} ${b.x} ${b.y}`;
    }
    el("path",{d,class:"throughline","data-tl":i,stroke:tl.color,"stroke-width":1.3},gThrough);
  });

  (data.future||[]).forEach((f,i)=>{
    let x=0,y=0,tot=0;
    for(const [tid,w] of Object.entries(f.weights||{})){
      const p=POS[tid]; if(!p)continue; x+=p.x*w; y+=p.y*w; tot+=w;
    }
    if(tot<=0){x=VB.w/2;y=VB.h/2;} else {x/=tot;y=y/tot-70*SCALE;}
    const id="future_"+i;
    POS[id]={x:clamp(x,VB.pad,VB.w-VB.pad),y:clamp(y,VB.pad,VB.h-VB.pad)};
    for(const [tid,w] of Object.entries(f.weights||{})){
      const p=POS[tid]; if(!p)continue;
      el("path",{d:curve(p.x,p.y,POS[id].x,POS[id].y,30),class:"hypha",
        stroke:TRUNKCOLOR[tid],"stroke-width":1.2,"stroke-dasharray":"2 6"},gLines);
    }
    drawNode(gNodes,defs,{id,label:f.name,years:"unfruited",color:blend(f.weights,TRUNKCOLOR),
      shape:0,r:20,kind:"future",seed:i*17+9});
    FLAT.push(id);
  });

  buildTLBar();
  svg.addEventListener("click",e=>{
    if(e.target.closest(".node"))return;
    panel.classList.remove("open"); qindex.classList.remove("open"); clearTL();
  });
}

function drawNode(parent,defs,o){
  const p=POS[o.id], R=o.r*SCALE;
  const g=el("g",{class:"node"+(o.kind==="future"?" future":""),transform:`translate(${p.x},${p.y})`,
    tabindex:"0",role:"button","aria-label":o.label,"data-id":o.id},parent);
  g.style.color=o.color;
  el("rect",{x:-2.2*SCALE,y:-2,width:4.4*SCALE,height:R*0.85,rx:2*SCALE,fill:"#cfc4ab",opacity:.75},g);
  const capD=CAPS[o.shape%CAPS.length](R);
  const capAttrs={d:capD,class:"cap"+(o.kind==="future"?" future-cap":""),
    fill:o.color,"fill-opacity":o.kind==="future"?0.35:0.92,
    stroke:o.color,"stroke-width":o.kind==="future"?1.6*SCALE:0,
    transform:`translate(0,${-R*0.15})`};
  if(o.glow)capAttrs.filter="url(#glowT)";
  el("path",capAttrs,g);
  // cap spots: deterministic pale flecks, clipped to the cap silhouette
  if(o.kind!=="future"){
    const clipId="clip-"+safeId(o.id);
    const cp=el("clipPath",{id:clipId},defs);
    el("path",{d:capD,transform:`translate(0,${-R*0.15})`},cp);
    const gs=el("g",{"clip-path":`url(#${clipId})`},g);
    const n=2+(o.seed%3);
    for(let k=0;k<n;k++){
      const sx=(((o.seed*67+k*41)%100)/100-0.5)*R*1.3;
      const sy=-R*(0.35+(((o.seed*29+k*53)%50))/100);
      el("ellipse",{cx:sx,cy:sy,rx:R*0.11,ry:R*0.08,fill:"#f2ead8",
        opacity:.22,class:"cap-spot"},gs);
    }
  }
  el("circle",{class:"ring",r:R+9*SCALE,stroke:o.color},g);
  const fs=(o.kind==="thread"?12.5:14.5)*SCALE;
  el("text",{class:"nlabel",y:R+16*SCALE,"font-size":fs},g).textContent=o.label;
  if(o.years) el("text",{class:"nyears",y:R+30*SCALE,"font-size":10.5*SCALE},g).textContent=o.years;

  g.addEventListener("click",()=>{ setFocus(FLAT.indexOf(o.id)); openFor(o.id); });
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();openFor(o.id);} });
}

/* ---------- lookup ---------- */
function findEntity(id){
  for(const t of DATA.trunks){
    if(t.id===id) return {kind:"trunk",trunk:t};
    for(const th of t.threads) if(th.id===id) return {kind:"thread",trunk:t,thread:th};
  }
  if(String(id).startsWith("future_")){
    const f=(DATA.future||[])[Number(String(id).split("_")[1])];
    if(f) return {kind:"future",future:f};
  }
  return null;
}

const panel=document.getElementById("panel"), pinner=document.getElementById("panelinner");
function txt(tag,cls,content,parent){ const e=document.createElement(tag);
  if(cls)e.className=cls; if(content!=null)e.textContent=content; parent.appendChild(e); return e; }
function triggerBlock(label,text,color,parent){

function renderDetail(det,parent){
  if(det==null)return;
  if(typeof det==="string"){
    det.split(/\n{2,}|\n/).map(s=>s.trim()).filter(Boolean)
       .forEach(par=>txt("p",null,par,parent));
    return;
  }
  if(typeof det!=="object")return;
  if(det.what){ txt("h3",null,"What",parent); txt("p",null,det.what,parent); }
  const KNOWN=new Set(["what","milestones","interview_use"]);
  for(const [key,val] of Object.entries(det)){
    if(KNOWN.has(key)||typeof val!=="string"||!val)continue;
    txt("h3",null,key.replace(/_/g," "),parent);
    txt("p",null,val,parent);
  }
  if(Array.isArray(det.milestones)&&det.milestones.length){
    txt("h3",null,"Milestones",parent);
    const ul=txt("ul",null,null,parent);
    det.milestones.forEach(m=>txt("li",null,m,ul));
  }
  if(det.interview_use){ txt("h3",null,"Interview use",parent); txt("p",null,det.interview_use,parent); }
}

function openFor(id){
  const ent=findEntity(id); if(!ent)return;
  const ui=DATA.ui||{};
  pinner.innerHTML="";
  if(ent.kind==="thread"){
    const col=TRUNKCOLOR[ent.trunk.id];
    const k=txt("div","kicker",null,pinner);
    const d=txt("span","dot","",k); d.style.background=col;
    txt("span",null,ent.trunk.name,k);
    txt("h2",null,ent.thread.name,pinner);
    txt("div","years",ent.thread.years||"",pinner);
    triggerBlock(ui.nodeTriggerLabel||"",ent.thread.trigger,col,pinner);
    renderDetail(ent.thread.detail,pinner);
    if(ent.thread.question_types.length){
      txt("h3",null,"Answers questions about",pinner);
      const q=txt("div","qtags",null,pinner);
      ent.thread.question_types.forEach(t=>txt("span","qtag",t,q));
    }
  } else if(ent.kind==="trunk"){
    const col=TRUNKCOLOR[ent.trunk.id];
    const k=txt("div","kicker",null,pinner);
    const d=txt("span","dot","",k); d.style.background=col;
    txt("span",null,"Trunk",k);
    txt("h2",null,ent.trunk.name,pinner);
    triggerBlock(ui.trunkTriggerLabel||"",ent.trunk.trigger,col,pinner);
    txt("h3",null,ent.trunk.threads.length+" "+(ui.trunkThreadCountSuffix||"threads"),pinner);
    const list=txt("div","threadlist",null,pinner);
    ent.trunk.threads.forEach(th=>{
      const b=txt("button",null,th.name+(th.years?"  ·  "+th.years:""),list);
      b.addEventListener("click",()=>{ setFocus(FLAT.indexOf(th.id)); openFor(th.id); });
    });
  } else if(ent.kind==="future"){
    const col=blend(ent.future.weights,TRUNKCOLOR);
    const k=txt("div","kicker",null,pinner);
    const d=txt("span","dot","",k); d.style.background=col;
    txt("span",null,"Unfruited · future role",k);
    txt("h2",null,ent.future.name,pinner);
    if(ent.future.note){ txt("p",null,ent.future.note,pinner); }
    txt("h3",null,"Fed by",pinner);
    const tot=Object.values(ent.future.weights||{}).reduce((a,b)=>a+b,0)||1;
    for(const [tid,w] of Object.entries(ent.future.weights||{})){
      const t=DATA.trunks.find(x=>x.id===tid); if(!t)continue;
      const row=txt("div","blend-row",null,pinner);
      const nm=txt("div","bl-name",null,row);
      txt("span",null,t.name,nm);
      txt("span",null,Math.round(w/tot*100)+"%",nm);
      const bar=txt("div","blend-bar",null,row);
      const fill=txt("i",null,"",bar);
      fill.style.width=Math.round(w/tot*100)+"%";
      fill.style.background=TRUNKCOLOR[tid];
    }
    txt("p",null,"Adjust the weights in the future block of your JSON — the cap color and these bars update on reload.",pinner).style.cssText="margin-top:14px;color:var(--spore-dim);font-size:12px";
  }
  panel.classList.add("open");
}
function openTLPanel(i){
  const tl=DATA.throughlines[i]; if(!tl)return;
  const ui=DATA.ui||{};
  pinner.innerHTML="";
  const k=txt("div","kicker",null,pinner);
  const d=txt("span","dot","",k); d.style.background=tl.color;
  txt("span",null,"Throughline",k);
  txt("h2",null,tl.name,pinner);
  triggerBlock(ui.throughlineTriggerLabel||"",tl.trigger,tl.color,pinner);
  txt("h3",null,ui.throughlineNodeListLabel||"Crosses",pinner);
  const list=txt("div","threadlist",null,pinner);
  tl.nodeIds.forEach((id,idx)=>{
    const ent=findEntity(id); if(!ent||ent.kind!=="thread")return;
    const b=txt("button",null,ent.thread.name,list);
    const mk=txt("span","mk",(idx+1<tl.nodeIds.length?(ui.throughlineNextMarker||"→"):(ui.throughlineEndMarker||"◆")),b);
    b.addEventListener("click",()=>{ setFocus(FLAT.indexOf(id)); openFor(id); });
  });
  panel.classList.add("open");
}
document.getElementById("panelclose").addEventListener("click",()=>panel.classList.remove("open"));

/* ---------- throughline highlight ---------- */
let activeTL=-1;
function clearTL(){
  activeTL=-1;
  document.getElementById("stage").classList.remove("tlmode");
  document.querySelectorAll(".throughline.active").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".node.lit").forEach(n=>n.classList.remove("lit"));
  document.querySelectorAll("#tlbar button.active").forEach(b=>b.classList.remove("active"));
}
function toggleTL(i,btn){
  if(activeTL===i){ clearTL(); panel.classList.remove("open"); return; }
  clearTL(); activeTL=i;
  const tl=DATA.throughlines[i]; if(!tl)return;
  document.getElementById("stage").classList.add("tlmode");
  const p=document.querySelector(`.throughline[data-tl="${i}"]`);
  if(p)p.classList.add("active");
  tl.nodeIds.forEach(id=>{
    const g=document.querySelector(`.node[data-id="${CSS.escape?id:id}"]`);
    if(g)g.classList.add("lit");
  });
  if(btn)btn.classList.add("active");
  openTLPanel(i);
}
function buildTLBar(){
  const bar=document.getElementById("tlbar");
  bar.innerHTML="";
  const ui=DATA.ui||{};
  if(ui.legendLabel){ const l=document.createElement("span");
    l.className="lbl"; l.textContent=ui.legendLabel; bar.appendChild(l); }
  DATA.throughlines.forEach((tl,i)=>{
    const b=document.createElement("button");
    b.textContent=(ui.legendPrefix||"⟿ ")+tl.name;
    b.style.borderColor=tl.color+"88";
    b.addEventListener("click",()=>toggleTL(i,b));
    bar.appendChild(b);
  });
}

/* ---------- question index ---------- */
const qindex=document.getElementById("qindex"), qwrap=document.getElementById("qwrap");
function buildQIndex(){
  qwrap.innerHTML="";
  txt("h2",null,"Question index",qwrap);
  txt("div","sub","interview archetypes → your best nodes",qwrap);
  const map={};
  DATA.trunks.forEach(t=>t.threads.forEach(th=>{
    th.question_types.forEach(q=>{ (map[q]=map[q]||[]).push({th,t}); });
  }));
  const keys=Object.keys(map).sort();
  if(!keys.length){
    txt("p","empty","No question_types tags found yet. Add question_types: [\"failure\", \"ownership\", ...] to threads in your JSON and this index builds itself — one prep session, permanent payoff.",qwrap);
    return;
  }
  keys.forEach(q=>{
    const sec=txt("div","arch",null,qwrap);
    txt("h3",null,"“Tell me about … "+q+"”",sec);
    map[q].forEach(({th,t})=>{
      const b=document.createElement("button");
      const dot=document.createElement("span"); dot.className="dot";
      dot.style.background=TRUNKCOLOR[t.id];
      b.appendChild(dot); b.appendChild(document.createTextNode(th.name));
      b.addEventListener("click",()=>{ qindex.classList.remove("open");
        setFocus(FLAT.indexOf(th.id)); openFor(th.id); });
      sec.appendChild(b);
    });
  });
}
document.getElementById("qclose").addEventListener("click",()=>qindex.classList.remove("open"));

/* ---------- keyboard ---------- */
function setFocus(i){
  if(i<0||i>=FLAT.length)return;
  focusIdx=i;
  document.querySelectorAll(".node.focused").forEach(n=>n.classList.remove("focused"));
  const g=document.querySelector(`.node[data-id="${FLAT[i]}"]`);
  if(g){ g.classList.add("focused"); g.focus({preventScroll:true}); }
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="Escape"){ panel.classList.remove("open"); qindex.classList.remove("open"); clearTL(); return; }
  if(e.key.toLowerCase()==="q"){ buildQIndex(); qindex.classList.toggle("open"); return; }
  if(/^[1-9]$/.test(e.key)){
    const t=DATA.trunks[Number(e.key)-1];
    if(t){ setFocus(FLAT.indexOf(t.id)); openFor(t.id); }
    return;
  }
  if(e.key==="ArrowRight"){ e.preventDefault(); setFocus(Math.min(FLAT.length-1,focusIdx+1)); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); setFocus(Math.max(0,focusIdx-1)); }
  if(e.key==="Enter"){ if(focusIdx<0) setFocus(0); openFor(FLAT[focusIdx]); }
});

/* ---------- boot ---------- */
function badge(msg){ const b=document.getElementById("databadge");
  b.textContent=msg; b.style.display="block"; }
function looksValid(d){ return d && Array.isArray(d.trunks) && d.trunks.length; }

let resizeTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(!DATA)return;
    const wasPortrait=isPortrait;
    updateMode();
    if(isPortrait!==wasPortrait){
      panel.classList.remove("open"); qindex.classList.remove("open"); clearTL();
      render(DATA);
    }
  },200);
});

function tryFetch(url){
  return fetch(url,{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error(url+" HTTP "+r.status); return r.json(); })
    .then(d=>{ if(!looksValid(d)) throw new Error(url+" unexpected shape"); return d; });
}
tryFetch("career.json")
  .catch(e1=>{ console.info(e1.message); return tryFetch("career_map.json"); })
  .then(d=>render(normalize(d)))
  .catch(e2=>{ console.warn(e2.message+" — using sample data");
    badge("sample data · place career.json beside this file");
    render(normalize(DUMMY)); });
</script>
