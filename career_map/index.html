<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Career Map</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #060b14;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ── MAP ── */
  #map { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }

  .map-title {
    position: absolute; top: 14px; left: 14px;
    color: #2d5a8e; font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; font-weight: 700;
  }
  .map-hint {
    position: absolute; top: 14px; right: 14px;
    color: #1e3a5f; font-size: 9.5px; letter-spacing: 0.5px;
    text-align: right; line-height: 1.7;
  }
  .map-hint.hidden { display: none; }

  .legend {
    position: absolute; bottom: 14px; left: 14px;
    display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; max-width: 68%;
  }
  .legend-label {
    color: #2d5a8e; font-size: 8.5px;
    text-transform: uppercase; letter-spacing: 2.5px; font-weight: 600;
  }
  .legend button {
    background: transparent; padding: 3px 11px;
    border-radius: 20px; font-size: 9px; cursor: pointer;
    font-family: inherit; opacity: 0.62;
    transition: opacity 0.15s; letter-spacing: 0.3px;
  }
  .legend button:hover, .legend button:focus-visible { opacity: 1; outline: none; }

  text { user-select: none; }
  .node-group, .trunk-group { cursor: pointer; }
  .tl-path { cursor: pointer; }

  /* ── PANEL ── */
  #panel {
    width: 325px; background: #070d1a;
    border-left: 1px solid #0d1525;
    display: none; flex-direction: column;
    overflow-y: auto; flex-shrink: 0;
  }
  #panel.open { display: flex; }
  .panel-close-row { display: flex; justify-content: flex-end; padding: 14px 16px 0; }
  .panel-close {
    background: none; border: none; color: #334155;
    cursor: pointer; font-size: 22px; line-height: 1; padding: 0 4px;
  }
  .panel-body { padding: 8px 22px 32px; }

  .eyebrow { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
  .title-lg { color: #e2e8f0; font-size: 17px; font-weight: 700; line-height: 1.3; margin-top: 8px; }
  .years { color: #334155; font-size: 11px; margin-top: 4px; }
  .detail {
    color: #4a6280; font-size: 13px; line-height: 1.75;
    margin-top: 16px; border-top: 1px solid #0f1d2e; padding-top: 14px;
  }
  .trigger-box { border-radius: 8px; padding: 11px 15px; margin-top: 10px; }
  .trigger-label {
    color: #334155; font-size: 8.5px; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 7px; font-weight: 600;
  }
  .trigger-text {
    color: #f1f5f9; font-size: 13px; font-style: italic;
    line-height: 1.65; font-family: "SF Mono", "Courier New", monospace;
  }
  .sub-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .sub-btn {
    border-radius: 6px; padding: 8px 12px; cursor: pointer;
    text-align: left; font-family: inherit; border-style: solid; border-width: 1px;
  }
  .sub-btn .s-name { font-size: 11px; font-weight: 600; }
  .sub-btn .s-sub { color: #334155; font-size: 10px; margin-top: 2px; }
  .tl-list-label {
    color: #334155; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 4px;
  }
  .tl-node-btn {
    border-radius: 6px; padding: 7px 12px; cursor: pointer;
    text-align: left; font-family: inherit; border-style: dashed;
    border-width: 1px; display: flex; align-items: center; gap: 8px;
  }
  .tl-node-btn .n-name { color: #94a3b8; font-size: 11px; font-weight: 600; }
  .tl-node-btn .n-sub { color: #334155; font-size: 9.5px; }

  /* ── MOBILE: panel becomes a bottom sheet ── */
  @media (max-width: 760px) {
    #app { display: block; }
    #map { height: 100vh; }
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%;
      max-height: 58vh; border-left: none; border-top: 1px solid #0d1525;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <svg id="svg" viewBox="-55 -15 1210 730" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="map-title" id="mapTitle"></div>
    <div class="map-hint" id="hint"></div>
    <div class="legend" id="legend">
      <span class="legend-label" id="legendLabel"></span>
    </div>
  </div>
  <div id="panel">
    <div class="panel-close-row"><button class="panel-close" id="closeBtn" aria-label="Close">×</button></div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<script>
"use strict";

async function loadCareerData() {
  const response = await fetch("career.json");
  if (!response.ok) throw new Error(`career.json responded with ${response.status}`);

  const data = await response.json();
  validateCareerData(data);
  return data;
}

loadCareerData()
  .then(initCareerMap)
  .catch(error => {
    console.error("Unable to load career data", error);
    document.getElementById("hint").textContent = "Unable to load career.json.";
  });

function warnData(message, context) {
  console.warn(`[career.json] ${message}`, context || "");
}

function hasProp(item, prop) {
  return Object.prototype.hasOwnProperty.call(item, prop);
}

function validateRequired(item, props, label) {
  props.forEach(prop => {
    if (!item || !hasProp(item, prop)) warnData(`${label} is missing required property "${prop}"`, item);
  });
}

function validateCareerData(data) {
  if (!data || typeof data !== "object") {
    warnData("Root value should be an object", data);
    return;
  }

  if (!Array.isArray(data.trunks)) warnData("Missing required property \"trunks\" as an array", data);
  if (!Array.isArray(data.throughlines)) warnData("Missing required property \"throughlines\" as an array", data);
  validateRequired(data.meta || {}, ["documentTitle"], "meta");
  validateRequired(data.map || {}, ["title", "origin", "ambientSpores"], "map");
  validateRequired(data.ui || {}, [
    "hintLines",
    "legendLabel",
    "legendPrefix",
    "nodeTriggerLabel",
    "trunkTriggerLabel",
    "trunkThreadCountSuffix",
    "throughlineTriggerLabel",
    "throughlineNodeListLabel",
    "throughlineNextMarker",
    "throughlineEndMarker"
  ], "ui");

  const trunks = Array.isArray(data.trunks) ? data.trunks : [];
  const throughlines = Array.isArray(data.throughlines) ? data.throughlines : [];
  const ids = new Set();
  const nodeIds = new Set();

  trunks.forEach((trunk, trunkIndex) => {
    validateRequired(trunk, ["id", "name", "trigger", "color", "pos", "threads"], `trunks[${trunkIndex}]`);
    if (trunk && trunk.id) {
      if (ids.has(trunk.id)) warnData(`Duplicate id "${trunk.id}"`, trunk);
      ids.add(trunk.id);
    }
    if (trunk && !Array.isArray(trunk.threads)) {
      warnData(`trunks[${trunkIndex}].threads should be an array`, trunk);
      return;
    }

    (trunk.threads || []).forEach((node, nodeIndex) => {
      validateRequired(node, ["id", "name", "years", "trigger", "detail", "pos"], `trunks[${trunkIndex}].threads[${nodeIndex}]`);
      if (!node || !node.id) return;
      if (ids.has(node.id)) warnData(`Duplicate id "${node.id}"`, node);
      ids.add(node.id);
      nodeIds.add(node.id);
    });
  });

  throughlines.forEach((throughline, throughlineIndex) => {
    validateRequired(throughline, ["id", "name", "trigger", "nodeIds", "color"], `throughlines[${throughlineIndex}]`);
    if (throughline && throughline.id) {
      if (ids.has(throughline.id)) warnData(`Duplicate id "${throughline.id}"`, throughline);
      ids.add(throughline.id);
    }
    if (throughline && !Array.isArray(throughline.nodeIds)) {
      warnData(`throughlines[${throughlineIndex}].nodeIds should be an array`, throughline);
      return;
    }
    (throughline.nodeIds || []).forEach(nodeId => {
      if (!nodeIds.has(nodeId)) warnData(`Throughline "${throughline.id}" references missing node "${nodeId}"`, throughline);
    });
  });
}

function initCareerMap(data) {
const trunks = Array.isArray(data.trunks) ? data.trunks : [];
const throughlines = Array.isArray(data.throughlines) ? data.throughlines : [];
const meta = data.meta || {};
const mapConfig = data.map || {};
const ui = data.ui || {};
const origin = Array.isArray(mapConfig.origin) ? mapConfig.origin : [0, 0];

document.title = meta.documentTitle || mapConfig.title || document.title;
document.getElementById("mapTitle").textContent = mapConfig.title || "";
const hintEl = document.getElementById("hint");
hintEl.replaceChildren();
(Array.isArray(ui.hintLines) ? ui.hintLines : []).forEach((line, index) => {
  if (index > 0) hintEl.appendChild(document.createElement("br"));
  hintEl.appendChild(document.createTextNode(line));
});
document.getElementById("legendLabel").textContent = ui.legendLabel || "";

// ── LOOKUPS ──
const NODE_POS = {}, NODE_BY_ID = {}, TRUNK_BY_ID = {};
trunks.forEach(t => {
  TRUNK_BY_ID[t.id] = t;
  t.threads.forEach(th => { NODE_POS[th.id] = th.pos; NODE_BY_ID[th.id] = { th, t }; });
});

const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function qPath(p1, p2, w) {
  const [x1,y1]=p1,[x2,y2]=p2;
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
  const len=Math.hypot(dx,dy)||1;
  return `M ${x1} ${y1} Q ${mx-(dy/len)*w} ${my+(dx/len)*w} ${x2} ${y2}`;
}

// ── STATE ──
let selected = null;
let hoverTL = null;

// ── BUILD SVG ──
const svgEl = document.getElementById("svg");

const defs = svg("defs", {});
// background gradient
const bgG = svg("radialGradient", { id:"bgG", cx:"50%", cy:"50%", r:"72%" });
bgG.appendChild(svg("stop", { offset:"0%", "stop-color":"#0d1826" }));
bgG.appendChild(svg("stop", { offset:"100%", "stop-color":"#030810" }));
defs.appendChild(bgG);
// per-trunk glow
trunks.forEach(t => {
  const f = svg("filter", { id:`gf-${t.id}`, x:"-80%", y:"-80%", width:"260%", height:"260%" });
  f.appendChild(svg("feGaussianBlur", { stdDeviation:"5.5", result:"b" }));
  const m = svg("feMerge", {});
  m.appendChild(svg("feMergeNode", { in:"b" }));
  m.appendChild(svg("feMergeNode", { in:"SourceGraphic" }));
  f.appendChild(m); defs.appendChild(f);
});
// soft glow
function softGlow(id, blur) {
  const f = svg("filter", { id, x:"-150%", y:"-150%", width:"400%", height:"400%" });
  f.appendChild(svg("feGaussianBlur", { stdDeviation:String(blur), result:"b" }));
  const m = svg("feMerge", {});
  m.appendChild(svg("feMergeNode", { in:"b" }));
  m.appendChild(svg("feMergeNode", { in:"SourceGraphic" }));
  f.appendChild(m); defs.appendChild(f);
}
softGlow("gf-s", 3);
softGlow("gf-origin", 10);
svgEl.appendChild(defs);

// background
svgEl.appendChild(svg("rect", { x:"-55", y:"-15", width:"1210", height:"730", fill:"url(#bgG)" }));

// ambient spores
const spores = Array.isArray(mapConfig.ambientSpores) ? mapConfig.ambientSpores : [];
spores.forEach(([x,y]) => svgEl.appendChild(svg("circle",{ cx:x, cy:y, r:1.5, fill:"#8bafc8", opacity:0.09 })));

// throughline paths
throughlines.forEach(tl => {
  const pts = tl.nodeIds.map(id => NODE_POS[id]).filter(Boolean);
  for (let i=0;i<pts.length-1;i++){
    const p = svg("path", {
      class:"tl-path", "data-tl":tl.id,
      d:qPath(pts[i],pts[i+1],44),
      stroke:tl.color, "stroke-width":1.3, "stroke-dasharray":"6 5",
      fill:"none", opacity:0.25, filter:"url(#gf-s)"
    });
    p.addEventListener("click", () => select({ type:"tl", tl }));
    p.addEventListener("mouseenter", () => setHoverTL(tl.id));
    p.addEventListener("mouseleave", () => setHoverTL(null));
    svgEl.appendChild(p);
  }
});

// origin → trunk
trunks.forEach(t => svgEl.appendChild(svg("path", {
  d:qPath(origin,t.pos,52), stroke:t.color, "stroke-width":2.5,
  fill:"none", opacity:0.30, filter:`url(#gf-${t.id})`
})));

// trunk → thread
trunks.forEach(t => t.threads.forEach(th => svgEl.appendChild(svg("path", {
  d:qPath(t.pos,th.pos,14), stroke:t.color, "stroke-width":1.8, fill:"none", opacity:0.46
}))));

// origin spore
svgEl.appendChild(svg("circle",{ cx:origin[0], cy:origin[1], r:11, fill:"#0a1422", stroke:"#1e3a5f", "stroke-width":1, filter:"url(#gf-origin)" }));
svgEl.appendChild(svg("circle",{ cx:origin[0], cy:origin[1], r:4, fill:"#4a7fa5", opacity:0.65 }));

// trunk nodes
trunks.forEach(t => {
  const g = svg("g", { class:"trunk-group" });
  g.appendChild(svg("circle",{ cx:t.pos[0], cy:t.pos[1], r:28, fill:"none", stroke:t.color, "stroke-width":0.6, opacity:0.18 }));
  const main = svg("circle",{
    "data-trunk":t.id, "data-color":t.color,
    cx:t.pos[0], cy:t.pos[1], r:17,
    fill:t.color+"1c", stroke:t.color, "stroke-width":1.5,
    filter:`url(#gf-${t.id})`, opacity:0.88
  });
  g.appendChild(main);
  const lbl = svg("text",{ x:t.pos[0], y:t.pos[1]-25, "text-anchor":"middle", fill:t.color, "font-size":10, "font-weight":600, opacity:0.88 });
  lbl.textContent = t.name; lbl.style.pointerEvents="none";
  g.appendChild(lbl);
  g.addEventListener("click", () => select({ type:"trunk", t }));
  svgEl.appendChild(g);
});

// thread nodes
trunks.forEach(t => t.threads.forEach(th => {
  const g = svg("g", { class:"node-group" });
  g.appendChild(svg("circle",{
    "data-node":th.id, "data-color":t.color,
    cx:th.pos[0], cy:th.pos[1], r:7.5,
    fill:t.color+"28", stroke:t.color, "stroke-width":1, filter:"url(#gf-s)"
  }));
  const nm = svg("text",{ x:th.pos[0], y:th.pos[1]+17, "text-anchor":"middle", fill:t.color, "font-size":8.5, "font-weight":500, opacity:0.82 });
  nm.textContent = th.name; nm.style.pointerEvents="none"; g.appendChild(nm);
  const yr = svg("text",{ x:th.pos[0], y:th.pos[1]+26, "text-anchor":"middle", fill:t.color, "font-size":7.5, opacity:0.40 });
  yr.textContent = th.years; yr.style.pointerEvents="none"; g.appendChild(yr);
  g.addEventListener("click", () => select({ type:"node", th, t }));
  svgEl.appendChild(g);
}));

// ── LEGEND ──
const legend = document.getElementById("legend");
throughlines.forEach(tl => {
  const b = document.createElement("button");
  b.textContent = (ui.legendPrefix || "") + tl.name;
  b.style.border = `1px dashed ${tl.color}65`;
  b.style.color = tl.color;
  b.addEventListener("click", () => select({ type:"tl", tl }));
  b.addEventListener("mouseenter", () => setHoverTL(tl.id));
  b.addEventListener("mouseleave", () => setHoverTL(null));
  legend.appendChild(b);
});

// ── INTERACTION ──
function setHoverTL(id) {
  hoverTL = id;
  document.querySelectorAll(".tl-path").forEach(p => {
    const on = p.getAttribute("data-tl") === id;
    p.setAttribute("stroke-width", on ? 2.8 : 1.3);
    p.setAttribute("opacity", on ? 0.78 : 0.25);
  });
}

function refreshSelection() {
  document.querySelectorAll("[data-node]").forEach(c => {
    const id = c.getAttribute("data-node"), col = c.getAttribute("data-color");
    const on = selected && selected.type === "node" && selected.th.id === id;
    c.setAttribute("r", on ? 11 : 7.5);
    c.setAttribute("fill", on ? col : col + "28");
    c.setAttribute("stroke-width", on ? 2 : 1);
  });
  document.querySelectorAll("[data-trunk]").forEach(c => {
    const id = c.getAttribute("data-trunk");
    const on = selected && selected.type === "trunk" && selected.t.id === id;
    c.setAttribute("stroke-width", on ? 2.5 : 1.5);
    c.setAttribute("opacity", on ? 1 : 0.88);
  });
}

const panel = document.getElementById("panel");
const panelBody = document.getElementById("panelBody");
const hint = document.getElementById("hint");

function triggerBox(color, label, text, dashed) {
  return `<div class="trigger-box" style="background:${color}10;border:1px ${dashed?"dashed":"solid"} ${color}40;">
    <div class="trigger-label">${label}</div>
    <div class="trigger-text">"${text}"</div></div>`;
}

function renderPanel() {
  if (!selected) { panel.classList.remove("open"); hint.classList.remove("hidden"); return; }
  panel.classList.add("open"); hint.classList.add("hidden");
  let html = "";

  if (selected.type === "node") {
    const { th, t } = selected;
    html += `<div class="eyebrow" style="color:${t.color};">${t.name}</div>`;
    html += `<div class="title-lg">${th.name}</div>`;
    html += `<div class="years">${th.years}</div>`;
    html += triggerBox(t.color, ui.nodeTriggerLabel || "", th.trigger, false);
    html += `<div class="detail">${th.detail}</div>`;
  }

  if (selected.type === "trunk") {
    const t = selected.t;
    html += `<div class="title-lg" style="color:${t.color};">${t.name}</div>`;
    html += triggerBox(t.color, ui.trunkTriggerLabel || "", t.trigger, false);
    html += `<div class="years" style="margin-top:14px;">${t.threads.length} ${ui.trunkThreadCountSuffix || ""}</div>`;
    html += `<div class="sub-list">`;
    t.threads.forEach(th => {
      html += `<button class="sub-btn" data-goto="${th.id}" style="background:${t.color}0d;border-color:${t.color}30;">
        <div class="s-name" style="color:${t.color};">${th.name}</div>
        <div class="s-sub">${th.years}</div></button>`;
    });
    html += `</div>`;
  }

  if (selected.type === "tl") {
    const tl = selected.tl;
    html += `<div class="title-lg" style="color:${tl.color};font-size:16px;">${tl.name}</div>`;
    html += triggerBox(tl.color, ui.throughlineTriggerLabel || "", tl.trigger, true);
    html += `<div class="sub-list"><div class="tl-list-label">${ui.throughlineNodeListLabel || ""}</div>`;
    tl.nodeIds.forEach((id, i) => {
      const ref = NODE_BY_ID[id]; if (!ref) return;
      const marker = i + 1 < tl.nodeIds.length ? ui.throughlineNextMarker : ui.throughlineEndMarker;
      html += `<button class="tl-node-btn" data-goto="${id}" style="background:${tl.color}08;border-color:${tl.color}35;">
        <span style="color:${tl.color};font-size:10px;">${marker}</span>
        <div><div class="n-name">${ref.th.name}</div>
        <div class="n-sub">${ref.t.name} · ${ref.th.years}</div></div></button>`;
    });
    html += `</div>`;
  }

  panelBody.innerHTML = html;
  panelBody.querySelectorAll("[data-goto]").forEach(btn => {
    btn.addEventListener("click", () => {
      const ref = NODE_BY_ID[btn.getAttribute("data-goto")];
      if (ref) select({ type:"node", th:ref.th, t:ref.t });
    });
  });
}

function select(sel) {
  selected = sel;
  refreshSelection();
  renderPanel();
}

document.getElementById("closeBtn").addEventListener("click", () => { selected = null; refreshSelection(); renderPanel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { selected = null; refreshSelection(); renderPanel(); } });
}
</script>
</body>
</html>
