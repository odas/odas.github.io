<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orpita Das · Career Map</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #060b14;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ── MAP ── */
  #map { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }

  .map-title {
    position: absolute; top: 14px; left: 14px;
    color: #2d5a8e; font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; font-weight: 700;
  }
  .map-hint {
    position: absolute; top: 14px; right: 14px;
    color: #1e3a5f; font-size: 9.5px; letter-spacing: 0.5px;
    text-align: right; line-height: 1.7;
  }
  .map-hint.hidden { display: none; }

  .legend {
    position: absolute; bottom: 14px; left: 14px;
    display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; max-width: 68%;
  }
  .legend-label {
    color: #2d5a8e; font-size: 8.5px;
    text-transform: uppercase; letter-spacing: 2.5px; font-weight: 600;
  }
  .legend button {
    background: transparent; padding: 3px 11px;
    border-radius: 20px; font-size: 9px; cursor: pointer;
    font-family: inherit; opacity: 0.62;
    transition: opacity 0.15s; letter-spacing: 0.3px;
  }
  .legend button:hover, .legend button:focus-visible { opacity: 1; outline: none; }

  text { user-select: none; }
  .node-group, .trunk-group { cursor: pointer; }
  .tl-path { cursor: pointer; }

  /* ── PANEL ── */
  #panel {
    width: 325px; background: #070d1a;
    border-left: 1px solid #0d1525;
    display: none; flex-direction: column;
    overflow-y: auto; flex-shrink: 0;
  }
  #panel.open { display: flex; }
  .panel-close-row { display: flex; justify-content: flex-end; padding: 14px 16px 0; }
  .panel-close {
    background: none; border: none; color: #334155;
    cursor: pointer; font-size: 22px; line-height: 1; padding: 0 4px;
  }
  .panel-body { padding: 8px 22px 32px; }

  .eyebrow { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
  .title-lg { color: #e2e8f0; font-size: 17px; font-weight: 700; line-height: 1.3; margin-top: 8px; }
  .years { color: #334155; font-size: 11px; margin-top: 4px; }
  .detail {
    color: #4a6280; font-size: 13px; line-height: 1.75;
    margin-top: 16px; border-top: 1px solid #0f1d2e; padding-top: 14px;
  }
  .trigger-box { border-radius: 8px; padding: 11px 15px; margin-top: 10px; }
  .trigger-label {
    color: #334155; font-size: 8.5px; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 7px; font-weight: 600;
  }
  .trigger-text {
    color: #f1f5f9; font-size: 13px; font-style: italic;
    line-height: 1.65; font-family: "SF Mono", "Courier New", monospace;
  }
  .sub-list { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
  .sub-btn {
    border-radius: 6px; padding: 8px 12px; cursor: pointer;
    text-align: left; font-family: inherit; border-style: solid; border-width: 1px;
  }
  .sub-btn .s-name { font-size: 11px; font-weight: 600; }
  .sub-btn .s-sub { color: #334155; font-size: 10px; margin-top: 2px; }
  .tl-list-label {
    color: #334155; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 4px;
  }
  .tl-node-btn {
    border-radius: 6px; padding: 7px 12px; cursor: pointer;
    text-align: left; font-family: inherit; border-style: dashed;
    border-width: 1px; display: flex; align-items: center; gap: 8px;
  }
  .tl-node-btn .n-name { color: #94a3b8; font-size: 11px; font-weight: 600; }
  .tl-node-btn .n-sub { color: #334155; font-size: 9.5px; }

  /* ── MOBILE: panel becomes a bottom sheet ── */
  @media (max-width: 760px) {
    #app { display: block; }
    #map { height: 100vh; }
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%;
      max-height: 58vh; border-left: none; border-top: 1px solid #0d1525;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <svg id="svg" viewBox="-55 -15 1210 730" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="map-title">Orpita Das · Career Map</div>
    <div class="map-hint" id="hint">
      click a node → recall trigger<br />
      click a trunk → trunk overview<br />
      click a throughline → the thread that crosses everything
    </div>
    <div class="legend" id="legend">
      <span class="legend-label">throughlines</span>
    </div>
  </div>
  <div id="panel">
    <div class="panel-close-row"><button class="panel-close" id="closeBtn" aria-label="Close">×</button></div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<script>
"use strict";

// ── ORIGIN SPORE ──
const O = [550, 360];

// ── CAREER DATA ──
const TRUNKS = [
  { id:"bio-root", name:"The Bio-Root",
    trigger:"I started as a biologist. That's not the detour — that's the source code.",
    color:"#4ade80", pos:[178,118], threads:[
    { id:"nitw", name:"NITW Biotech", years:"2008–12",
      trigger:"Top 1% nationally. C++ before I knew what a pipeline was.",
      detail:"B.Tech Biotechnology Engineering, NIT Warangal. AIEEE top 1% nationally. MITACS-funded research internship at McGill. Merit scholarship 2011–12. The computation habits formed here.",
      pos:[72,38] },
    { id:"ubc", name:"UBC M.Sc.", years:"2012–15",
      trigger:"Best Student Talk at Banff — only M.Sc. in a room of PhDs.",
      detail:"Fully funded NSERC Scholar. Arabidopsis thesis: diurnal regulation of lignin biosynthetic genes. RNA-seq, statistical analysis on messy biological datasets. The thesis was a data project. (Note: parchment reads Botany; work was molecular/cell biology — see degree-wording task.)",
      pos:[208,38] },
    { id:"sci-comm", name:"Science Communicator", years:"2014–16",
      trigger:"Explaining DNA to Grade 8 kids. The IIA talk came from here.",
      detail:"GenomeBC / Let's Talk Science. Genomics workshops Grades 8–12. Explaining complex things simply is a practiced skill, not a personality trait.",
      pos:[295,152] },
  ]},
  { id:"bio-adjacent", name:"Bio-Adjacent Circuit",
    trigger:"Post-MSc: tried three directions. Then tried a PhD. The pivot story runs through all of this.",
    color:"#22d3ee", pos:[102,388], threads:[
    { id:"stemshock", name:"StemShock Startup", years:"2016",
      trigger:"Formulated an mRNA herbicide. Got a raise in 3 months. Company was acquired.",
      detail:"Biological Technician, StemShock Inc. (acq. by Terramera). Formulated RNAi mRNA herbicide. Supported investor fundraising. Multi-hat startup context: first time bridging science to business communication.",
      pos:[35,298] },
    { id:"freelance-research", name:"Freelance Research", years:"2017–18",
      trigger:"Literature review for a psychiatrist. Federal forestry lab contract.",
      detail:"Core Medical Centre (mental health lit review) + Natural Resources Canada contract. Domain-transfer proof: the research methodology is portable across fields.",
      pos:[35,428] },
    { id:"uoft-phd", name:"UofT PhD", years:"2018–19",
      trigger:"Started a PhD. Left. That decision led to Lantern — and eventually Snowflake.",
      detail:"PhD student, U of Toronto. Conifer cold tolerance (dehydrin proteins). A+ in Computational Biology & Bioinformatics — Python SNP analysis in microbial genomes. The pivot wasn't drift.",
      pos:[108,510] },
  ]},
  { id:"deliberate-pivot", name:"The Deliberate Pivot",
    trigger:"Left a PhD, went back to school for data, then shipped four projects in three months.",
    color:"#818cf8", pos:[315,572], threads:[
    { id:"lantern", name:"Lantern Data Cert.", years:"Sept–Dec 2019",
      trigger:"91st percentile on DataCamp. Four months, then immediately shipped projects.",
      detail:"Data Analytics & Data Science Certificate, Lantern Institute, Toronto. SQL, Tableau, R, Python (pandas, numpy, scikit-learn, keras). The pivot was a structured 4-month commitment, not a drift.",
      pos:[188,642] },
    { id:"freelance-ds", name:"4 Projects in 3 Months", years:"Jan–Mar 2020",
      trigger:"A fintech dashboard, health viz, two Kaggles. Three months.",
      detail:"Interac KPI dashboard (Tableau). Samsung Health viz app (Dash/Plotly, GCP App Engine). Kaggle: Credit Card Fraud (Autoencoder + XGBoost, +12%). Kaggle: NLP Tweets (87% accuracy). Breadth-first entry.",
      pos:[318,654] },
    { id:"bugseq", name:"BugSeq Taxonomy DB", years:"Apr 2020",
      trigger:"SQLite from NCBI FTP to validate a microbial taxonomy ML model. Biology met DE.",
      detail:"Data Scientist Intern, Next Gen Microbiology. NCBI Taxonomy FTP → SQLite. Schema design to validate BugSeq ML model. First explicit DE work — and first time biology knowledge directly accelerated it.",
      pos:[432,636] },
    { id:"waterloo", name:"Protein ML (Waterloo)", years:"Apr–Jul 2020",
      trigger:"Bayesian hyperparameter search through combinatorial protein sequence space.",
      detail:"ML Intern, U of Waterloo. Feature extraction from protein databases. Ensemble ML + Bayesian tuning (Hyperopt) + Dask parallelism. QSAR prediction. Research-grade ML fluency, not just applied tooling.",
      pos:[492,560] },
  ]},
  { id:"production-engineering", name:"Production Data Engineering",
    trigger:"2.5 years shipping real pipelines and compliance automation at Snowflake itself.",
    color:"#c084fc", pos:[600,588], threads:[
    { id:"pipelines", name:"Pipeline Architect (20+)", years:"2020–23",
      trigger:"GitHub GraphQL, ServiceNow, Salesforce, Okta — 20+ APIs, one CI/CD pipeline.",
      detail:"Data Engineer, Snowflake, Pune. Among earliest Pune office employees. ELT via Lambda, API Gateway, External Functions, Fivetran, Airflow. SnowPro Core Certified. DataShare proposal for GitHub data.",
      pos:[498,658] },
    { id:"sox", name:"SOX Compliance Automation", years:"2020–23",
      trigger:"SQL that replaced 100+ manual audit hours per quarter. Audit became a partner team.",
      detail:"Real-time SQL monitoring: Access Management exceptions, SSO/SCIM gaps, Password Control violations. 100+ audit hours saved per quarter. Changed business processes. Not just pipelines — systems that change behaviour.",
      pos:[638,660] },
    { id:"presenter", name:"7 Audiences + IIA", years:"2022–23",
      trigger:"Presented SOX architecture to the Institute of Internal Auditors, San Jose.",
      detail:"7 external customer presentations. IIA San Jose chapter. Represented Snowflake at US industry events. A Data Engineer who presents to external auditors is unusual. Connects directly to Banff 2014.",
      pos:[742,572] },
  ]},
  { id:"genomics-cloud-bridge", name:"Genomics–Cloud Bridge",
    trigger:"The one role where biology and production cloud engineering happened simultaneously.",
    color:"#38bdf8", pos:[832,452], threads:[
    { id:"algo-bio", name:"Algorithmic Biologics", years:"Jul–Dec 2023",
      trigger:"Gene expression app to AWS. Batch → GKE. Biology + cloud + production. All three at once.",
      detail:"Cloud Engineer, Algorithmic Biologics, Bengaluru. Deployed Tapestry gene expression app to AWS. AWS Batch → GKE migration. Collaborated with bioinformaticians on variant calling. For bio roles: this is already the work.",
      pos:[912,528] },
  ]},
  { id:"ai-tools-era", name:"AI Tools Era",
    trigger:"Built independently. Got clear on what I want.",
    color:"#f59e0b", pos:[958,132], threads:[
    { id:"ai-portfolio", name:"7 AI Apps", years:"2023–present",
      trigger:"Seven friction-killers in a chat window. No pipeline, no team.",
      detail:"ReceiptIQ (Gemini Vision), Daily dashboard (Skyfield + Sheets), FOLIO (mutual funds), Gamified interview prep (SQLite + XP), Write-like-me, Noetone (TTS audiobook), AI quiz. Each from a real friction point. 'The syntax got cheap. The judgment didn't.'",
      pos:[878,50] },
    { id:"catadoption", name:"catadoption_pune", years:"2024–present",
      trigger:"~120 street cats adopted in 6 months. Data-driven animal welfare.",
      detail:"Founder. ~120 Indie cats adopted. Same Streamlit/Gemini/Plotly stack as portfolio apps. Measurable outcomes, real community impact. The AI tooling isn't padding — it's applied to a real problem.",
      pos:[998,50] },
    { id:"upwork", name:"Upwork Freelancer", years:"2023–present",
      trigger:"Selling custom AI quiz and training apps to small teams. Skills become services.",
      detail:"Freelance AI tools developer. Custom quiz and training app builds. Commercial validation — not just portfolio exploration.",
      pos:[1058,148] },
    { id:"snowflake-genai", name:"Snowflake GenAI Cert", years:"2025–present",
      trigger:"Labs-first. Snowflake domain meets GenAI — intentional positioning.",
      detail:"Snowflake GenAI Professional Certificate (Coursera). Labs-first approach. Positioning at the intersection of deep Snowflake expertise and the GenAI wave.",
      pos:[1042,240] },
  ]},
];

const THROUGHLINES = [
  { id:"tl-present", name:"The Presentation Thread",
    trigger:"This has been true since 2014. Not a skill listed — a habit built.",
    nodeIds:["sci-comm","presenter","algo-bio"], color:"#fbbf24" },
  { id:"tl-bio", name:"Biology as Domain Accelerator",
    trigger:"The biology is not background — it keeps paying dividends.",
    nodeIds:["ubc","uoft-phd","bugseq","waterloo","algo-bio"], color:"#34d399" },
  { id:"tl-merit", name:"Funded by Competitive Selection",
    trigger:"I moved countries fully funded, on merit. More than once.",
    nodeIds:["nitw","ubc","uoft-phd"], color:"#a78bfa" },
  { id:"tl-systems", name:"I Think in Systems",
    trigger:"'A data engineer who thinks in systems and loves taking friction out of them.'",
    nodeIds:["sox","catadoption","ai-portfolio"], color:"#fb923c" },
];

// ── LOOKUPS ──
const NODE_POS = {}, NODE_BY_ID = {}, TRUNK_BY_ID = {};
TRUNKS.forEach(t => {
  TRUNK_BY_ID[t.id] = t;
  t.threads.forEach(th => { NODE_POS[th.id] = th.pos; NODE_BY_ID[th.id] = { th, t }; });
});

const SVG_NS = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function qPath(p1, p2, w) {
  const [x1,y1]=p1,[x2,y2]=p2;
  const mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1;
  const len=Math.hypot(dx,dy)||1;
  return `M ${x1} ${y1} Q ${mx-(dy/len)*w} ${my+(dx/len)*w} ${x2} ${y2}`;
}

// ── STATE ──
let selected = null;
let hoverTL = null;

// ── BUILD SVG ──
const svgEl = document.getElementById("svg");

const defs = svg("defs", {});
// background gradient
const bgG = svg("radialGradient", { id:"bgG", cx:"50%", cy:"50%", r:"72%" });
bgG.appendChild(svg("stop", { offset:"0%", "stop-color":"#0d1826" }));
bgG.appendChild(svg("stop", { offset:"100%", "stop-color":"#030810" }));
defs.appendChild(bgG);
// per-trunk glow
TRUNKS.forEach(t => {
  const f = svg("filter", { id:`gf-${t.id}`, x:"-80%", y:"-80%", width:"260%", height:"260%" });
  f.appendChild(svg("feGaussianBlur", { stdDeviation:"5.5", result:"b" }));
  const m = svg("feMerge", {});
  m.appendChild(svg("feMergeNode", { in:"b" }));
  m.appendChild(svg("feMergeNode", { in:"SourceGraphic" }));
  f.appendChild(m); defs.appendChild(f);
});
// soft glow
function softGlow(id, blur) {
  const f = svg("filter", { id, x:"-150%", y:"-150%", width:"400%", height:"400%" });
  f.appendChild(svg("feGaussianBlur", { stdDeviation:String(blur), result:"b" }));
  const m = svg("feMerge", {});
  m.appendChild(svg("feMergeNode", { in:"b" }));
  m.appendChild(svg("feMergeNode", { in:"SourceGraphic" }));
  f.appendChild(m); defs.appendChild(f);
}
softGlow("gf-s", 3);
softGlow("gf-origin", 10);
svgEl.appendChild(defs);

// background
svgEl.appendChild(svg("rect", { x:"-55", y:"-15", width:"1210", height:"730", fill:"url(#bgG)" }));

// ambient spores
const SPORE = [[148,178],[355,118],[722,252],[935,348],[262,545],[658,476],
  [810,146],[458,616],[975,500],[498,82],[340,300],[760,390],[600,200],[180,620],[870,280]];
SPORE.forEach(([x,y]) => svgEl.appendChild(svg("circle",{ cx:x, cy:y, r:1.5, fill:"#8bafc8", opacity:0.09 })));

// throughline paths
THROUGHLINES.forEach(tl => {
  const pts = tl.nodeIds.map(id => NODE_POS[id]).filter(Boolean);
  for (let i=0;i<pts.length-1;i++){
    const p = svg("path", {
      class:"tl-path", "data-tl":tl.id,
      d:qPath(pts[i],pts[i+1],44),
      stroke:tl.color, "stroke-width":1.3, "stroke-dasharray":"6 5",
      fill:"none", opacity:0.25, filter:"url(#gf-s)"
    });
    p.addEventListener("click", () => select({ type:"tl", tl }));
    p.addEventListener("mouseenter", () => setHoverTL(tl.id));
    p.addEventListener("mouseleave", () => setHoverTL(null));
    svgEl.appendChild(p);
  }
});

// origin → trunk
TRUNKS.forEach(t => svgEl.appendChild(svg("path", {
  d:qPath(O,t.pos,52), stroke:t.color, "stroke-width":2.5,
  fill:"none", opacity:0.30, filter:`url(#gf-${t.id})`
})));

// trunk → thread
TRUNKS.forEach(t => t.threads.forEach(th => svgEl.appendChild(svg("path", {
  d:qPath(t.pos,th.pos,14), stroke:t.color, "stroke-width":1.8, fill:"none", opacity:0.46
}))));

// origin spore
svgEl.appendChild(svg("circle",{ cx:O[0], cy:O[1], r:11, fill:"#0a1422", stroke:"#1e3a5f", "stroke-width":1, filter:"url(#gf-origin)" }));
svgEl.appendChild(svg("circle",{ cx:O[0], cy:O[1], r:4, fill:"#4a7fa5", opacity:0.65 }));

// trunk nodes
TRUNKS.forEach(t => {
  const g = svg("g", { class:"trunk-group" });
  g.appendChild(svg("circle",{ cx:t.pos[0], cy:t.pos[1], r:28, fill:"none", stroke:t.color, "stroke-width":0.6, opacity:0.18 }));
  const main = svg("circle",{
    "data-trunk":t.id, "data-color":t.color,
    cx:t.pos[0], cy:t.pos[1], r:17,
    fill:t.color+"1c", stroke:t.color, "stroke-width":1.5,
    filter:`url(#gf-${t.id})`, opacity:0.88
  });
  g.appendChild(main);
  const lbl = svg("text",{ x:t.pos[0], y:t.pos[1]-25, "text-anchor":"middle", fill:t.color, "font-size":10, "font-weight":600, opacity:0.88 });
  lbl.textContent = t.name; lbl.style.pointerEvents="none";
  g.appendChild(lbl);
  g.addEventListener("click", () => select({ type:"trunk", t }));
  svgEl.appendChild(g);
});

// thread nodes
TRUNKS.forEach(t => t.threads.forEach(th => {
  const g = svg("g", { class:"node-group" });
  g.appendChild(svg("circle",{
    "data-node":th.id, "data-color":t.color,
    cx:th.pos[0], cy:th.pos[1], r:7.5,
    fill:t.color+"28", stroke:t.color, "stroke-width":1, filter:"url(#gf-s)"
  }));
  const nm = svg("text",{ x:th.pos[0], y:th.pos[1]+17, "text-anchor":"middle", fill:t.color, "font-size":8.5, "font-weight":500, opacity:0.82 });
  nm.textContent = th.name; nm.style.pointerEvents="none"; g.appendChild(nm);
  const yr = svg("text",{ x:th.pos[0], y:th.pos[1]+26, "text-anchor":"middle", fill:t.color, "font-size":7.5, opacity:0.40 });
  yr.textContent = th.years; yr.style.pointerEvents="none"; g.appendChild(yr);
  g.addEventListener("click", () => select({ type:"node", th, t }));
  svgEl.appendChild(g);
}));

// ── LEGEND ──
const legend = document.getElementById("legend");
THROUGHLINES.forEach(tl => {
  const b = document.createElement("button");
  b.textContent = "⟿ " + tl.name;
  b.style.border = `1px dashed ${tl.color}65`;
  b.style.color = tl.color;
  b.addEventListener("click", () => select({ type:"tl", tl }));
  b.addEventListener("mouseenter", () => setHoverTL(tl.id));
  b.addEventListener("mouseleave", () => setHoverTL(null));
  legend.appendChild(b);
});

// ── INTERACTION ──
function setHoverTL(id) {
  hoverTL = id;
  document.querySelectorAll(".tl-path").forEach(p => {
    const on = p.getAttribute("data-tl") === id;
    p.setAttribute("stroke-width", on ? 2.8 : 1.3);
    p.setAttribute("opacity", on ? 0.78 : 0.25);
  });
}

function refreshSelection() {
  document.querySelectorAll("[data-node]").forEach(c => {
    const id = c.getAttribute("data-node"), col = c.getAttribute("data-color");
    const on = selected && selected.type === "node" && selected.th.id === id;
    c.setAttribute("r", on ? 11 : 7.5);
    c.setAttribute("fill", on ? col : col + "28");
    c.setAttribute("stroke-width", on ? 2 : 1);
  });
  document.querySelectorAll("[data-trunk]").forEach(c => {
    const id = c.getAttribute("data-trunk");
    const on = selected && selected.type === "trunk" && selected.t.id === id;
    c.setAttribute("stroke-width", on ? 2.5 : 1.5);
    c.setAttribute("opacity", on ? 1 : 0.88);
  });
}

const panel = document.getElementById("panel");
const panelBody = document.getElementById("panelBody");
const hint = document.getElementById("hint");

function triggerBox(color, label, text, dashed) {
  return `<div class="trigger-box" style="background:${color}10;border:1px ${dashed?"dashed":"solid"} ${color}40;">
    <div class="trigger-label">${label}</div>
    <div class="trigger-text">"${text}"</div></div>`;
}

function renderPanel() {
  if (!selected) { panel.classList.remove("open"); hint.classList.remove("hidden"); return; }
  panel.classList.add("open"); hint.classList.add("hidden");
  let html = "";

  if (selected.type === "node") {
    const { th, t } = selected;
    html += `<div class="eyebrow" style="color:${t.color};">${t.name}</div>`;
    html += `<div class="title-lg">${th.name}</div>`;
    html += `<div class="years">${th.years}</div>`;
    html += triggerBox(t.color, "recall trigger", th.trigger, false);
    html += `<div class="detail">${th.detail}</div>`;
  }

  if (selected.type === "trunk") {
    const t = selected.t;
    html += `<div class="title-lg" style="color:${t.color};">${t.name}</div>`;
    html += triggerBox(t.color, "trunk trigger", t.trigger, false);
    html += `<div class="years" style="margin-top:14px;">${t.threads.length} threads — click individual nodes to explore.</div>`;
    html += `<div class="sub-list">`;
    t.threads.forEach(th => {
      html += `<button class="sub-btn" data-goto="${th.id}" style="background:${t.color}0d;border-color:${t.color}30;">
        <div class="s-name" style="color:${t.color};">${th.name}</div>
        <div class="s-sub">${th.years}</div></button>`;
    });
    html += `</div>`;
  }

  if (selected.type === "tl") {
    const tl = selected.tl;
    html += `<div class="title-lg" style="color:${tl.color};font-size:16px;">${tl.name}</div>`;
    html += triggerBox(tl.color, "throughline", tl.trigger, true);
    html += `<div class="sub-list"><div class="tl-list-label">nodes on this thread</div>`;
    tl.nodeIds.forEach((id, i) => {
      const ref = NODE_BY_ID[id]; if (!ref) return;
      const marker = i + 1 < tl.nodeIds.length ? "→" : "⊙";
      html += `<button class="tl-node-btn" data-goto="${id}" style="background:${tl.color}08;border-color:${tl.color}35;">
        <span style="color:${tl.color};font-size:10px;">${marker}</span>
        <div><div class="n-name">${ref.th.name}</div>
        <div class="n-sub">${ref.t.name} · ${ref.th.years}</div></div></button>`;
    });
    html += `</div>`;
  }

  panelBody.innerHTML = html;
  panelBody.querySelectorAll("[data-goto]").forEach(btn => {
    btn.addEventListener("click", () => {
      const ref = NODE_BY_ID[btn.getAttribute("data-goto")];
      if (ref) select({ type:"node", th:ref.th, t:ref.t });
    });
  });
}

function select(sel) {
  selected = sel;
  refreshSelection();
  renderPanel();
}

document.getElementById("closeBtn").addEventListener("click", () => { selected = null; refreshSelection(); renderPanel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { selected = null; refreshSelection(); renderPanel(); } });
</script>
</body>
</html>
